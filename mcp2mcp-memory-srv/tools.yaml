# genai-toolbox configuration for knowledge graph database
# See: https://googleapis.github.io/genai-toolbox/resources/sources/postgres/

sources:
  kg-db:
    kind: postgres
    host: ${DB_HOST}
    port: ${DB_PORT}
    database: ${DB_DATABASE}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

tools:
  execute_sql:
    kind: postgres-sql
    source: kg-db
    description: Execute SQL queries against the knowledge graph database
    statement: $1
    parameters:
      - name: sql
        type: string
        description: The SQL statement to execute
